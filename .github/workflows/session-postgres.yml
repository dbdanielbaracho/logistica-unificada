name: PostgreSQL session integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: session_test
          POSTGRES_PASSWORD: session_test
          POSTGRES_DB: session_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U session_test -d session_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --test tests/session-postgres-integration.test.mjs
        env:
          SESSION_TEST_POSTGRES: '1'
